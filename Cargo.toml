[package]
name = "lazytree"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Copy-on-write development workspaces for parallel coding agents"
readme = "README.md"
rust-version = "1.75"

[[bin]]
name = "lazytree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
